<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver Scissors | Premium Men's Salon in Hirapur, Dhanbad</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #08080a;
      --bg-card: rgba(22, 22, 26, 0.65);
      --bg-card-hover: rgba(35, 35, 42, 0.85);
      --primary: #cbd5e1;
      --accent-gold: #d4af37;
      --accent-green: #25d366;
      --text-main: #fafafa;
      --text-muted: #a3a3a3;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(212, 175, 55, 0.35);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* =========================================================
       TRANSPARENT BACKGROUND THEME & WATERMARK PATTERN
       ========================================================= */
    .bg-watermark-pattern {
      position: fixed;
      inset: 0;
      /* Subtle geometric & scissors line-art watermark */
      background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Floating Giant Transparent Barber Silhouette in Background */
    .bg-giant-silhouette {
      position: fixed;
      top: 25%;
      right: -5%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(40px);
    }

    .bg-ambient-left {
      position: fixed;
      bottom: 15%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(50px);
    }

    /* Preloader */
    #preloader {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 99999;
    }
    .loader-title {
      font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;
    }
    .loader-title span { color: var(--accent-gold); }
    .loader-bar-wrap {
      width: 150px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden;
    }
    .loader-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #d4af37, #a8a29e);
    }

    /* Navbar */
    .navbar {
      background: rgba(8, 8, 10, 0.75); backdrop-filter: blur(20px);
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-subtle);
    }
    .logo {
      font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none;
      display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif;
    }
    .logo i { color: var(--accent-gold); }
    .nav-btn {
      background: var(--text-main); color: var(--bg-dark); padding: 8px 18px; border-radius: 50px;
      font-weight: 700; text-decoration: none; font-size: 0.85rem; transition: 0.3s;
    }
    .nav-btn:hover { background: var(--accent-gold); color: #000; }

    /* Hero Section with Video and Floating PNGs */
    .hero-reel {
      position: relative; width: 100%; min-height: 82vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      padding: 70px 20px;
      z-index: 1;
    }
    .reel-video {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      min-width: 100%; min-height: 100%; object-fit: cover; z-index: -1; opacity: 0.35;
    }
    .reel-overlay {
      position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(8,8,10,0.4) 0%, var(--bg-dark) 92%); z-index: 1;
    }
    .reel-content {
      position: relative; z-index: 2; text-align: center; max-width: 740px;
    }

    .floating-png {
      position: absolute;
      width: 90px;
      opacity: 0.35;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
      pointer-events: none;
      animation: floatSlow 6s ease-in-out infinite alternate;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .png-left { top: 15%; left: 6%; }
    .png-right { bottom: 15%; right: 6%; animation-delay: 3s; }

    @keyframes floatSlow {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(8deg); }
    }

    .rating-badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(212, 175, 55, 0.12);
      color: var(--accent-gold); padding: 6px 16px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid rgba(212,175,55,0.3);
      backdrop-filter: blur(8px);
    }
    .hero-reel h1 { font-size: clamp(2.3rem, 5.5vw, 3.8rem); font-weight: 800; line-height: 1.15; margin-bottom: 16px; font-family: 'Space Grotesk', sans-serif; }
    .hero-reel h1 span { color: var(--accent-gold); }
    .hero-reel p { font-size: 1.05rem; color: #e5e5e5; margin-bottom: 30px; }
    
    .btn-book {
      background: var(--accent-green); color: #000; padding: 15px 34px; border-radius: 50px;
      font-size: 1.05rem; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
      transition: 0.3s; box-shadow: 0 4px 25px rgba(37, 211, 102, 0.35);
    }
    .btn-book:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6); }

    /* Info Bar (Glassmorphic) */
    .info-bar {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 22px 20px;
      background: rgba(14, 14, 18, 0.6); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    }
    .info-item { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.88rem; }
    .info-item i { color: var(--accent-gold); font-size: 1.1rem; }

    /* Services Section */
    .services-sec { position: relative; z-index: 1; padding: 75px 20px; max-width: 1100px; margin: 0 auto; }
    .sec-header { text-align: center; margin-bottom: 45px; }
    .sec-header h2 { font-size: 2.3rem; font-weight: 800; font-family: 'Space Grotesk', sans-serif; }
    .sec-header span { color: var(--accent-gold); }

    .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .service-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px;
      overflow: hidden; transition: 0.35s ease; backdrop-filter: blur(16px);
    }
    .service-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .service-img-box {
      width: 100%; height: 190px; overflow: hidden; position: relative;
    }
    .service-img-box img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
    }
    .service-card:hover .service-img-box img { transform: scale(1.08); }
    .service-body { padding: 22px; text-align: left; }
    .service-body h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .service-body p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }

    /* Gallery Section with Frosted Background */
    .gallery-sec {
      position: relative; z-index: 1; padding: 65px 20px;
      background: rgba(10, 10, 14, 0.65); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    }
    .gallery-grid {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;
    }
    .gallery-item {
      position: relative; border-radius: 16px; overflow: hidden; height: 260px;
      border: 1px solid var(--border-subtle);
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
    }
    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      display: flex; align-items: flex-end; padding: 16px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .gallery-item:hover img { transform: scale(1.1); }
    .gallery-item:hover .gallery-overlay { opacity: 1; }
    .gallery-overlay span {
      font-size: 0.9rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px;
    }

    /* Reviews Section */
    .reviews-sec { position: relative; z-index: 1; padding: 75px 20px; }
    .review-wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .review-box {
      background: var(--bg-card); backdrop-filter: blur(16px);
      padding: 26px; border-radius: 16px; border-left: 4px solid var(--accent-gold);
      border-top: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    }
    .stars { color: var(--accent-gold); margin-bottom: 10px; font-size: 0.9rem; }
    .review-text { font-size: 0.98rem; font-style: italic; color: #e5e5e5; margin-bottom: 12px; }
    .reviewer { font-weight: 700; font-size: 0.85rem; color: var(--primary); }

    /* Footer */
    footer {
      position: relative
